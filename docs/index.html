ral Health`,items:[`Phone contacts with Clancy and, with her consent, Patrick confirmed referral completion.`,`Patrick's prescription concerns were redirected to the medication prescriber.`]},{date:`Dec 30`,provider:`Massachusetts General Hospital`,organization:`Emergency psychiatric evaluation`,items:[`Voluntary hospital presentation on the pathway to McLean admission.`]}]},{month:`January`,groups:[{date:`Jan 1`,provider:`Alia Goodheart, MD`,organization:`McLean Hospital`,items:[`Voluntary inpatient admission.`,`Quetiapine taper began at 75 mg, with 50 mg and 25 mg steps recorded before discontinuation.`,`Ativan (lorazepam) 1 mg and Desyrel (trazodone) 50 mg were used or planned during the admission.`]},{date:`Jan 5`,provider:`Alia Goodheart, MD`,organization:`McLean Hospital`,items:[`Discharged with next-day psychiatry follow-up required.`,`Trazodone 50 mg ×28 and lorazepam 1 mg ×14 filled; melatonin was planned.`]},{date:`Jan 6`,provider:`Jennifer Tufts, MD`,organization:`Aster Mental Health`,items:[`Post-discharge telehealth follow-up.`,`Trazodone 100 mg and lorazepam 1 mg were reportedly being taken.`]},{date:`Jan 9`,provider:`Jennifer Tufts, MD`,organization:`Aster Mental Health`,items:[`Lorazepam changed to Valium (diazepam) as a longer-half-life taper strategy.`,`Diazepam 5 mg ×14 filled.`]},{date:`Jan 11`,provider:`Jennifer Tufts, MD`,organization:`Aster Mental Health`,items:[`MyChart message asked about ketamine because of persistently low mood.`]},{date:`Jan 12`,provider:`Jennifer Tufts, MD`,organization:`Aster Mental Health`,items:[`Trazodone increased to 150 mg; 150 mg ×30 filled.`]},{date:`Jan 13`,provider:`Prescriber unresolved`,organization:`Pharmacy record`,items:[`Diazepam 2 mg ×7 filled; the public record contains a prescriber-attribution conflict.`]},{date:`Jan 16`,provider:`Jennifer Tufts, MD`,organization:`Aster Mental Health`,items:[`Telehealth follow-up.`,`Elavil (amitriptyline) 10 mg ×30 filled; diazepam 2 mg was dispensed, but the original t prescription was deferred.`],source:`SRC-0087, Trial Day 9, pp. 105–107, 05:52:52–05:59:25; SRC-0091, Trial Day 10, 02:55:00–03:03:03 and 05:35:15–05:36:38`,caution:`The encounter establishes the reported temporal association; it does not by itself prove a bipolar switch, medication causation, or a delusion.`,views:[`course`]},{id:`oct21`,date:`2022-10-21T10:00:00`,displayDate:`October 21`,title:`Telehealth follow-up: acute insomnia and anxiety`,short:`Next-day video visit with Dr. Tufts`,category:`clinical`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`top`,tier:0,summary:`Clancy reported no sleep the preceding night, severe anxiety and heart racing, worry about the children and sleep, GI symptoms, crying, and fogginess.`,details:[`She described yawning without feeling drowsy.`,`Tufts did not observe pressured speech, hyperactivity, mania, psychosis, suicidal ideation, homicidal ideation, or hallucinations.`,`Prescription/fill: lorazepam 0.5 mg ×7 for short-term PRN treatment of severe anxiety.`],source:`SRC-0087, Trial Day 9, pp. 107–109, 05:58:25–06:04:28; SRC-0091, Trial Day 10`,caution:`‘Not drowsy’ is ambiguous within a broader picture of distressed insomnia.`,views:[`course`]},{id:`oct26`,date:`2022-10-26T12:00:00`,displayDate:`October 26`,title:`Telehealth visit: persistent anxiety and depression`,short:`Video visit · lorazepam reduced anxiety but not insomnia`,category:`clinical`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`bottom`,tier:2,summary:`Clancy reported that lorazepam reduced anxiety but did not help sleep; over-the-counter diphenhydramine had been more helpful. Her mood remained anxious and depressed.`,details:[`She denied suicidal and homicidal ideation, and Tufts observed no psychosis or communication difficulty.`,`They discussed non-benzodiazepine medication options after the sertraline effects had reportedly resolved.`,`Prescriptions/fills: lorazepam 1 mg ×30; buspirone 5 mg ×30; hydroxyzine 25 mg ×30.`],source:`SRC-0087, Trial Day 9, pp. 109–111, 06:04:37–06:10:07; SRC-0091, Trial Day 10`,caution:`The fills do not establish which medications were subsequently taken; buspirone was later reported not started.`,views:[`course`]},{id:`therapy`,date:`2022-10-31T12:00:00`,displayDate:`October 31`,title:`Therapy appointment: likely virtual`,short:`Approx. one hour · SI and HI denied`,category:`clinical`,evidence:`Contemporaneous record`,certainty:`Moderate`,clinician:`Jennifer McAllister`,institution:`Aster Mental Health`,side:`top`,tier:2,summary:`A therapy note later read at trial stated that Clancy denied suicidal or homicidal ideation.`,details:[`Tufts was not present for the encounter and testified that she was not completely certain of the modality, although she thought it was virtual.`,`The complete therapy chart is unavailable, and cross-examination questioned how extensively suicidality was assessed.`],source:`SRC-0087, Trial Day 9, pp. 111–112, 06:10:18–06:11:23; SRC-0091, Trial Day 10, 03:05:25–03:10:45`,caution:`The note's limited content is supported; the modality is probable rather than certain, and the unrecorded conversation cannot be reconstructed.`,views:[`course`]},{id:`nov2`,date:`2022-11-02T12:00:00`,displayDate:`November 2`,title:`Telehealth follow-up: sleep improves`,short:`Video visit · lorazepam helps; buspirone not started`,category:`clinical`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`bottom`,tier:1,summary:`Clancy reported that lorazepam helped and sleep had improved. Tufts emphasized that it was not a long-term solution and planned a gradual taper.`,details:[`Clancy said she had not started buspirone because she was afraid to begin a new medication.`,`Her affect appeared appropriate and her reported mood was euthymic; she denied SI and HI.`,`Prescription/refill: lorazepam 0.5 mg ×40; 0.25-mg reductions every two weeks were planned.`],source:`SRC-0087, Trial Day 9, pp. 111–113, 06:10:53–06:16:20; SRC-0091, Trial Day 10, pp. 77–78`,views:[`course`]},{id:`ed`,date:`2022-11-16T12:00:00`,displayDate:`November 16`,title:`Emergency department visit: South Shore`,short:`Insomnia, anxiety and palpitations`,category:`hospital`,evidence:`Contemporaneous record`,certainty:`High`,institution:`South Shore ED`,side:`top`,tier:1,summary:`Clancy presented to the emergency department for insomnia, anxiety, and palpitations. Patrick believed she had slept very little for approximately 48 hours.`,details:[`Patrick believed she had slept very little for approximately 48 hours.`,`Clancy later told Paul that the treatment prescribed after the visit helped her fall asleep but did not maintain sleep.`,`Prescription/fill after the visit: trazodone 50 mg ×30.`],source:`SRC-0065; SRC-0091; Exhibit 222 described on Trial Day 11`,caution:`The encounter is established; exact sleep duration and later treatment effect are patient/collateral reports.`,views:[`course`]},{id:`paul-intake`,date:`2022-11-21T10:00:00`,displayDate:`November 21`,title:`In-person intake: perinatal psychiatry`,short:`Face-to-face · linear, goal-directed, engaged in planning`,category:`clinical`,evidence:`Treating testimony`,certainty:`High`,clinician:`Julie Paul, psychiatric NP`,institution:`South Shore Perinatal Behavioral Health`,side:`bottom`,tier:0,summary:`Clancy described anxiety, overwhelm, racing thoughts, insomnia, and prior sertraline intolerance. She denied SI, HI, and hallucinations, and appeared linear and goal-directed.`,details:[`The EPDS self-harm item was negative.`,`She reported that Ativan plus Benadryl had helped sleep.`,`Prescription/fill: fluoxetine 10 mg ×56.`],source:`SRC-0091, Trial Day 10, pp. 96–98, 06:27:23–06:33:23`,views:[`course`]},{id:`nov25`,date:`2022-11-25T12:00:00`,displayDate:`November 25`,title:`MyChart exchange: fluoxetine stopped`,short:`Sleep regimen changed without a visit`,category:`medication`,evidence:`Treating testimony`,certainty:`High`,clinician:`Julie Paul, psychiatric NP`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:2,summary:`After a short fluoxetine trial associated with worse sleep and feeling disconnected or ‘spacey,’ Paul stopped it and changed the sleep regimen.`,details:[`Zolpidem 5 mg ×1, mirtazapine 7.5 mg ×30, and clonazepam 0.5 mg ×14 were filled.`,`Paul warned against combining clonazepam with lorazepam.`,`Zolpidem ingestion is not established.`],medication:`Stop fluoxetine; start mirtazapine/clonazepam`,source:`SRC-0091; SRC-0048`,caution:`Paul’s term ‘activation’ does not itself establish mania or medication-induced psychosis.`,views:[`course`]},{id:`disconnected`,date:`2022-11-27T20:00:00`,displayDate:`November 27`,title:`MyChart message: “disconnected … from reality”`,short:`Frightening experience after sleeping`,category:`symptom`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Julie Paul, psychiatric NP`,institution:`South Shore Perinatal Behavioral Health`,side:`bottom`,tier:2,summary:`After reporting mirtazapine 15 mg plus clonazepam 0.5 mg and sleep, Clancy wrote that she felt ‘super disconnected with myself and reality.’`,details:[`She had reported two nights of clonazepam and considered stopping it.`,`Paul considered sedation or disorientation and supported stopping clonazepam.`],civilClaims:[{claim:`The complaint expands this episode to allege that she could not determine what was real, drive, or remain alone.`,source:`SRC-0032 ¶¶39–40`,context:`The contemporaneous message supports the quoted disconnection experience; the additional functional consequences are pleading allegations.`}],medication:`Mirtazapine 15 mg + clonazepam 0.5 mg reportedly taken`,source:`SRC-0091, p. 104; compare SRC-0032 ¶¶39–40`,caution:`Clinically compatible with derealization, depersonalization, sedation, anxiety, or nonspecific disorientation—not automatically psychosis.`,views:[`course`]},{id:`panic`,date:`2022-11-28T12:00:00`,displayDate:`November 28`,title:`Provider contact/progress note: panic attack`,short:`Phone or MyChart unresolved · PHP suggested`,category:`symptom`,evidence:`Contemporaneous record`,certainty:`Moderate`,clinician:`Julie Paul, psychiatric NP`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:0,summary:`Clancy reported a panic attack. Paul suggested lorazepam and a run and recommended Women & Infants partial-hospital care.`,details:[`Paul remembered entering a progress note but could not firmly establish whether the discussion occurred by phone or MyChart.`,`Clancy described logistical difficulty attending the program.`,`No psychosis was documented in the available exchange.`],source:`SRC-0091, Trial Day 10, pp. 104–107, 06:47:55–06:53:39`,caution:`The clinical content is supported; the communication medium is unresolved.`,views:[`course`]},{id:`jollotta-intake`,date:`2022-11-29T15:00:00`,displayDate:`November 29`,title:`Telehealth visit: first Jollotta assessment`,short:`EPDS 17 · GAD-7 14 · anxious but linear`,category:`clinical`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`bottom`,tier:0,summary:`Clancy described fragmented sleep, disorientation, forgetfulness, feeling disconnected from her body, and intense anxiety about sleep.`,details:[`She reported about two hours of sleep followed by several hours awake and sometimes used lorazepam to return to sleep.`,`Jollotta offered zolpidem 10 mg/ER and hydroxyzine; Clancy declined and preferred mirtazapine 15 mg with PRN lorazepam.`,`No SI/HI, mania, hallucinations, delusions, or psychosis were observed or reported in this encounter.`],medication:`Continue mirtazapine 15 mg + PRN lorazepam`,source:`SRC-0096, Trial Day 11, pp. 17–26`,caution:`Negative findings apply to this encounter, not every moment outside it.`,views:[`course`]},{id:`child-thoughts`,date:`2022-11-30T09:00:00`,displayDate:`Late Nov.`,title:`Child-harm thoughts disclosed to Patrick`,short:`Distressing; no plan, intent, or external voice`,category:`collateral`,evidence:`Collateral testimony`,certainty:`Moderate`,side:`top`,tier:1,summary:`Patrick later testified that over one or two nights Clancy described distressing thoughts involving harm or illness affecting the children.`,details:[`She appeared disturbed by the thoughts and gave no method, plan, or intent.`,`Patrick said she did not describe an external voice. He asked whether she needed to be kept away from the children; she said no, and he observed no intent and did not then believe they were unsafe.`,`Her parents came to support the family. Patrick later confirmed only that a disclosure of ‘horrible thoughts’ occurred in her mother's presence—not that her mother independently reported child-harm content.`],civilClaims:[{claim:`The complaint alleges that Clancy also told her mother the thoughts involved harming the children and that she feared other people could hear her thoughts, she would be locked up, or the children would be taken.`,source:`SRC-0032 ¶50`,context:`No testimony from her mother or contemporaneous note had established those specifics through Trial Day 13. Patrick's sworn account establishes a more limited disclosure and her mother's presence.`}],source:`SRC-0065, Trial Day 1, 02:06:24–02:11:58; SRC-0068, Trial Day 2, 01:46:52–01:47:49; compare SRC-0032 ¶50`,caution:`Patrick's collateral account, suicidal portal messages, pleaded thought-reading allegations, and the later command-voice account are distinct sources and phenomena.`,views:[`course`]},{id:`quetiapine-start`,date:`2022-11-30T16:00:00`,displayDate:`November 30`,title:`MyChart message: asks to stop mirtazapine`,short:`Worse depression; quetiapine discussed for sleep`,category:`medication`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`bottom`,tier:1,summary:`Clancy asked to stop mirtazapine after roughly five nights, reporting much worse depression and only about two hours of sleep. Jollotta proposed low-dose quetiapine for insomnia.`,details:[`Clancy twice requested a phone call. Jollotta could not call between patients, so a nurse called around 3:10 p.m.; Clancy agreed to the plan and to collect quetiapine.`,`Quetiapine 25 mg ×30 was filled.`,`A fluoxetine retrial was discussed but not yet established as taken.`],medication:`Quetiapine 25 mg prescribed/filled`,source:`SRC-0096, pp. 27–31, approximately 01:41:00–01:46:41; SRC-0048`,caution:`At 25 mg, the stated target was sleep; the fill does not establish ingestion.`,views:[`course`]},{id:`intrusive`,date:`2022-12-01T12:00:00`,displayDate:`December 1`,title:`MyChart message: “very intrusive thoughts”`,short:`Mirtazapine skipped; content initially unspecified`,category:`symptom`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:3,summary:`Clancy wrote that she disliked mirtazapine and had ‘very intrusive thoughts that I never had before.’`,details:[`She had skipped mirtazapine and preferred fluoxetine with Ativan/Benadryl.`,`She later planned mirtazapine 15 mg with quetiapine 25 mg.`,`The immediate message did not clearly elicit or record the thought content.`],civilClaims:[{claim:`The complaint retrospectively characterizes the ‘intrusive thoughts’ as auditory hallucinations and alleges continuing self-deprecating and death-related commands.`,source:`SRC-0032 ¶¶42, 49–50`,context:`Jollotta testified that the content disclosed to her was suicidal, not child-directed, and that no voice or psychosis was reported or observed in her contacts.`}],source:`SRC-0096, pp. 30–33; compare SRC-0032 ¶¶42, 49–50`,caution:`Later testimony identified the thoughts disclosed to Jollotta as suicidal, not child-directed; diagnostic reinterpretation in a pleading is not the contemporaneous record.`,views:[`course`]},{id:`death-thoughts`,date:`2022-12-02T09:00:00`,displayDate:`December 2`,title:`MyChart message: wanting it “all over”`,short:`Numbness and indifference to dying`,category:`symptom`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`bottom`,tier:3,summary:`After reporting mirtazapine 15 mg plus quetiapine 25 mg, Clancy awoke with ‘horribly intrusive thoughts of wanting it to be all over.’`,details:[`She took lorazepam 1 mg, returned to sleep, and said the thoughts stopped.`,`Later she wrote, ‘I feel like I’m going to die and I don’t care.’`,`Jollotta provided crisis information, asked about support, and recommended quetiapine 50 mg for sleep.`],medication:`Mirtazapine + quetiapine reportedly taken; lorazepam 1 mg afterward`,source:`SRC-0096, pp. 32–40`,caution:`The temporal sequence does not establish medication causation.`,views:[`course`]},{id:`dec3`,date:`2022-12-03T18:00:00`,displayDate:`December 3`,title:`MyChart message: severe depression continues`,short:`Lorazepam 0.5 mg reportedly brings relief`,category:`symptom`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:1,summary:`Clancy reported roughly four hours plus 45 minutes of sleep and ongoing severe depression and intrusive thoughts.`,details:[`She later reported taking lorazepam 0.5 mg at about 6 p.m. and feeling better.`,`Symptom improvement after a dose does not identify the underlying disorder.`],medication:`Lorazepam 0.5 mg reportedly taken`,source:`SRC-0096, p. 42 and p. 94`,views:[`course`]},{id:`dec6`,date:`2022-12-06T14:00:00`,displayDate:`December 6`,title:`In-person visit: bipolarity considered`,short:`Patrick present · activation history · MDQ negative`,category:`clinical`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`bottom`,tier:0,summary:`At an in-person visit with Patrick, the earlier sertraline episode was described as roughly 48 hours without sleep and without fatigue. Jollotta called it an activating response and considered bipolar disorder.`,details:[`Patrick said he pressed for an in-person visit because of perceived telehealth disconnection and concern about the number of medication changes; family came to support them.`,`The prior MDQ was negative, other manic indicators were not elicited, and Jollotta testified criteria were not met then. Patrick said, ‘My wife is not bipolar.’`,`The EPDS was 21, which Jollotta described as severe signs of postpartum depression. She provided mood charts; she later recalled that Clancy said she printed one but did not recall reviewing a completed chart.`,`Jollotta observed no mania, hallucinations, delusions, psychosis, or current suicidal plan/intent.`,`She considered stopping quetiapine, reconsidering fluoxetine, and replacing lorazepam with longer-half-life diazepam for tapering.`],civilClaims:[{claim:`The complaint alleges that Patrick said she was ‘ten thousand times worse’ since the medication sequence began and asked to start over.`,source:`SRC-0032 ¶47`,context:`Jollotta remembered general concern about worsening anxiety and medication burden but did not adopt the vivid quotation in Day 11 testimony.`}],medication:`Diazepam strategy begins; quetiapine temporarily reconsidered`,source:`SRC-0065, 02:09:49–02:11:36; SRC-0096, pp. 43–51 and 06:11:48–06:21:59; compare SRC-0032 ¶47`,caution:`This was an active differential—not a confirmed bipolar diagnosis; the complaint's vivid quotation is not established testimony.`,views:[`course`]},{id:`dec7`,date:`2022-12-07T12:00:00`,displayDate:`December 7`,title:`MyChart exchange: possible mixed state considered`,short:`Fluoxetine held; quetiapine titration proposed`,category:`medication`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:0,summary:`After about four hours of sleep on diazepam/melatonin, Clancy again said she was not tired. Jollotta held fluoxetine and targeted possible hypomanic or mixed symptoms.`,details:[`Proposed quetiapine sequence: 100 → 200 → 300 → 400 mg over successive nights.`,`Olanzapine with fluoxetine was discussed but not prescribed or taken.`,`Diazepam tapering continued.`],medication:`Quetiapine 100→400 mg recommended; fluoxetine held`,source:`SRC-0096, pp. 51–56`,caution:`The 400-mg target was recommended. It was not shown to have been taken.`,views:[`course`]},{id:`dec12`,date:`2022-12-12T12:00:00`,displayDate:`December 12`,title:`MyChart message: sleep improves; depression persists`,short:`Reports quetiapine 200 mg—not 400 mg`,category:`medication`,evidence:`Reported to clinician`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`bottom`,tier:1,summary:`Clancy reported taking quetiapine 200 mg plus diazepam 2.5 mg for three nights, sleeping deeply for seven to eight hours, but remaining ‘incredibly depressed and unmotivated.’`,details:[`This is the strongest available evidence of the dose actually taken during the proposed titration.`,`Improved sleep did not correspond to meaningful mood improvement.`],medication:`Quetiapine 200 mg + diazepam 2.5 mg reportedly taken`,source:`SRC-0096, pp. 57–62`,views:[`course`]},{id:`dec13`,date:`2022-12-13T15:00:00`,displayDate:`December 13`,title:`Telehealth visit: hopelessness persists`,short:`Numbness · EPDS self-harm item “sometimes”`,category:`clinical`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:2,summary:`At virtual follow-up, Clancy reported seven to nine hours of sleep but persistent hopelessness, numbness, and poor motivation.`,details:[`She denied current suicidal ideation, although the EPDS recorded self-harm thoughts ‘sometimes’ during the preceding week.`,`Jollotta observed no mania or psychosis.`,`Jollotta later testified that Clancy never reported child-harm thoughts to her.`],source:`SRC-0096, pp. 57–62`,views:[`course`]},{id:`dec15`,date:`2022-12-15T15:00:00`,displayDate:`December 15`,title:`Phone call: “worst day”; higher care urged`,short:`Persistent suicidal thoughts; no active plan`,category:`symptom`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`bottom`,tier:0,summary:`Clancy and Patrick described her worst day, with persistent intrusive thoughts of suicide but no active plan. Both agreed that a higher level of care might be needed.`,details:[`Patrick separately testified that the MGH visit followed Clancy telling her father she wanted suicide, then telling Patrick, ‘I told my dad I want to die and it didn't bother me at all.’ Her father had not testified through Day 13.`,`Jollotta discussed MGH emergency evaluation, possible McLean care, and release-of-information needs.`,`Clancy went to MGH and then chose outpatient Women & Infants follow-up.`],source:`SRC-0065, 02:12:20–02:12:47; SRC-0096, pp. 63–66`,caution:`No active plan was disclosed in the cited exchange; the statement to her father is Patrick's sworn account of what Clancy told him.`,views:[`course`]},{id:`dec16`,date:`2022-12-16T15:00:00`,displayDate:`December 16`,title:`MyChart exchange: plan updated after MGH`,short:`Jollotta messages · sleep restored, mood not improved`,category:`medication`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:1,summary:`In MyChart messages after the MGH evaluation and a separate Tufts video visit, Clancy reported sleeping on quetiapine 200 mg plus diazepam 2 mg but experiencing no mood improvement.`,details:[`Jollotta recommended quetiapine 300 mg as a bipolar-depression target.`,`Clancy reported that Tufts had recommended adding lamotrigine 25 mg and asked whether Jollotta agreed.`,`Jollotta endorsed lamotrigine and provided rash/titration counseling but did not know whether Clancy took it.`],medication:`Lamotrigine 25 mg endorsed; quetiapine 300 mg recommended`,source:`SRC-0096, Trial Day 11, pp. 66–70, 03:45:34–03:51:32`,caution:`Lamotrigine endorsement and the quetiapine target were treatment recommendations; neither establishes ingestion or diagnosis.`,views:[`course`]},{id:`wi`,date:`2022-12-20T12:00:00`,displayDate:`December 20`,title:`Program assessment: Women & Infants`,short:`Same-day discharge; general PHP recommended`,category:`hospital`,evidence:`Treating testimony`,certainty:`Moderate`,institution:`Women & Infants`,side:`bottom`,tier:2,summary:`Clancy entered the Women & Infants program and was discharged the same day, with a recommendation to come off quetiapine and pursue a general mental-health PHP.`,details:[`Jollotta was not opposed to tapering but worried about loss of structured support, persistent intrusive thoughts, and starting a taper while she was away.`,`Women & Infants material indicated an attempted call to Jollotta; she testified that she never received it.`],civilClaims:[{claim:`The complaint alleges EPDS 23 and GAD-7 21 scores, specific descriptions of profound depression/numbness, and a medication-induced formulation attributed to the Women & Infants clinician.`,source:`SRC-0032 ¶¶52–57`,context:`The pleading uses a December 21 date, while treating evidence places attendance on December 20. The complete Exhibit 220 is unavailable, so the pleaded formulation is not treated as the medical record.`}],source:`SRC-0096; Exhibit 220 described on Days 10–11; compare SRC-0032 ¶¶52–57`,caution:`The complete Women & Infants record is not publicly available, and the communication failure and pleaded clinical details remain unresolved.`,views:[`course`]},{id:`taper`,date:`2022-12-21T12:00:00`,displayDate:`December 21`,title:`MyChart message: quetiapine taper sent`,short:`200 → 100 → 50 → stop`,category:`medication`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:0,summary:`Jollotta ordered quetiapine 200 mg for four nights, 100 mg for four nights, 50 mg for four nights, then discontinuation.`,details:[`Nurse Nicole Heiden-Francis called to review risks of worsening mood and sleep, confirmed that Clancy still wished to taper while Jollotta was away, and provided DBT-group information.`,`Quetiapine 100 mg ×14 and 25 mg ×14 were filled on December 21–22.`,`The taper schedule is an intended regimen, not proof that every dose was taken.`],medication:`Quetiapine taper`,source:`SRC-0096, pp. 69–74, 04:02:09–04:04:08; SRC-0048`,views:[`course`]},{id:`mgh-dec30`,date:`2022-12-30T12:00:00`,displayDate:`December 30`,title:`Hospital presentation: returns to MGH`,short:`Seeks McLean-level treatment`,category:`hospital`,evidence:`Retrospective report`,certainty:`Moderate`,institution:`MGH`,side:`bottom`,tier:1,summary:`The available record places an MGH presentation before the January 1 voluntary transfer to McLean, but the exact December 29–31 sequence is not fully resolved.`,details:[`A South Shore record establishes that Patrick called on December 30 seeking McLean admission guidance and was directed to the emergency-department or 911 pathway because beds could not be held.`,`Patrick testified that on December 31 he told Clancy it was time for McLean because suicidal thoughts continued and he was exhausted.`,`Goodheart’s testimony establishes voluntary arrival at McLean from MGH on January 1.`],civilClaims:[{claim:`The complaint instead alleges that by December 29 Clancy told Patrick, ‘I can't tough it out anymore. I need to go to McLean.’`,source:`SRC-0032 ¶59`,context:`The pleading and Patrick's sworn testimony differ on the date and who initiated the McLean decision.`}],source:`SRC-0096, p. 73, 04:04:35–04:05:42; SRC-0065, 02:16:48–02:17:18; SRC-0087; compare SRC-0032 ¶¶59–62`,caution:`The record contains a date/initiator discrepancy; the civil chronology is not the underlying MGH chart.`,views:[`course`]},{id:`mclean`,date:`2023-01-01T12:00:00`,displayDate:`January 1–5`,title:`Inpatient admission: McLean`,short:`Voluntary · severe depression · no psychosis observed`,category:`hospital`,evidence:`Treating testimony`,certainty:`High`,clinician:`Alia Goodheart, MD`,institution:`McLean Hospital`,side:`top`,tier:1,summary:`The provisional admitting formulation was severe major depression without psychotic features. Bipolarity was considered, but no firm diagnosis was established.`,details:[`January 1, about 4 a.m.: Jasmine Outlaw evaluated her for voluntary admission, documented low risk with 15-minute checks, and provisionally formulated severe MDD without psychotic features.`,`Later January 1 and January 2: Elizabeth Madva documented numbness or mild hospital anxiety, sleep at a lower quetiapine dose, and denials of delusions, hallucinations, SI, and HI.`,`January 3: Goodheart found anxiety but linear, goal-directed thought and no psychosis. She considered bipolar/peripartum illness but had insufficient information for a firm diagnosis.`,`January 3 family texts said Clancy was all right but anxious about meeting the full psychiatry team and worried that she would not be sent home soon; the messages were patient-reported context rather than clinician observations.`,`McLean tapered quetiapine approximately 75 → 50 → 25 → 0, switched diazepam to lorazepam, and used trazodone and melatonin for sleep.`,`January 4: she reported hospital anxiety and asked to go home earlier than the Friday initially discussed. Goodheart conditioned January 5 discharge on arranging next-day psychiatry follow-up; Clancy did so within about an hour.`],civilClaims:[{claim:`The complaint alleges that McLean operated with a ‘skeleton crew’ and that she did not see a doctor until January 3.`,source:`SRC-0032 ¶¶61–63`,context:`Sworn testimony described physician evaluations by Outlaw on January 1 and Madva on January 1–2, contradicting the pleaded ‘no doctor until January 3’ claim.`}],medication:`Quetiapine tapered off; diazepam → lorazepam; trazodone/melatonin`,source:`SRC-0087, Trial Day 9, pp. 20–32, 01:16:19–01:49:34; SRC-0099, Trial Day 13, pp. 42–43; compare SRC-0032 ¶¶61–63`,caution:`Time-limited inpatient observations and family messages do not decide symptoms outside those moments; the complete McLean chart remains unavailable.`,views:[`course`]},{id:`discharge`,date:`2023-01-05T15:00:00`,displayDate:`January 5`,title:`Inpatient discharge: McLean`,short:`Discharged home · next-day psychiatry follow-up required`,category:`hospital`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Alia Goodheart, MD`,institution:`McLean Hospital`,side:`bottom`,tier:0,summary:`Clancy requested an earlier voluntary discharge because she felt anxious in the hospital and wanted to be home with family and the children. Goodheart permitted January 5 discharge only after next-day psychiatric follow-up was arranged.`,details:[`At admission she had separately hoped to be home for Cora's birthday. She was not discharged against medical advice, and ‘demanded discharge’ is not supported by the sworn record.`,`January 3 family texts documented anxiety about meeting the psychiatry team and worry that she would not be sent home soon; they do not show a demand or an against-medical-advice departure.`,`Goodheart said she would have preferred more diagnostic time but identified no acute safety concern. She had Patrick collateral and considered the history consistent.`,`Discharge planning included the next-day appointment, Psychology Today and Blue Cross case-management resources, a crisis plan, and after-visit information.`,`Discharge prescriptions: trazodone 50 mg ×28 and lorazepam 1 mg ×14; melatonin was planned; no further quetiapine was planned.`],civilClaims:[{claim:`The complaint alleges a roughly ten-minute post-discharge Goodheart call offering antidepressant names and says Clancy left the ‘best hospital’ feeling there was little hope.`,source:`SRC-0032 ¶¶65–66`,context:`No independent post-discharge call record was located through Day 13. Goodheart's testimony placed discussion of Cymbalta during the admission, not necessarily in a later call.`}],source:`SRC-0087, Trial Day 9, pp. 28–37 and 55–58, 01:36:58–02:04:00 and 03:22:34–03:30:15; SRC-0099, Trial Day 13, pp. 42–43; compare SRC-0032 ¶¶65–66`,caution:`A discharge assessment is a time-limited clinical judgment, not proof of symptoms at later times.`,views:[`course`]},{id:`jan6`,date:`2023-01-06T12:00:00`,displayDate:`January 6`,title:`Telehealth follow-up: after McLean discharge`,short:`Video visit · full inpatient chart unavailable to Tufts`,category:`clinical`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`top`,tier:2,summary:`Clancy remained depressed and numb after the quetiapine taper and described rebound anxiety as lorazepam wore off. She reported trazodone 100 mg, lorazepam 1 mg, and melatonin 5 mg.`,details:[`She denied SI, HI, and psychosis.`,`Tufts planned trazodone 150 mg and monitoring off quetiapine before adding another antidepressant.`,`Tufts had a discharge summary but not the complete McLean chart and had not spoken directly with the discharging psychiatrist.`,`The chart's ‘deteriorating’ dropdown meant somewhat worse than December 16, not acute decompensation.`],medication:`Trazodone 100 mg + lorazepam 1 mg + melatonin 5 mg reported`,source:`SRC-0087, Trial Day 9, pp. 121–123, 06:37:35–06:44:04; SRC-0091`,caution:`Medication use is patient report; this video assessment is a time-limited snapshot.`,views:[`course`]},{id:`jan9`,date:`2023-01-09T12:00:00`,displayDate:`January 9`,title:`Prescription change: lorazepam to diazepam`,short:`Longer half-life for rebound anxiety/taper`,category:`medication`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`bottom`,tier:2,summary:`Tufts replaced lorazepam with longer-half-life diazepam to reduce rebound anxiety and facilitate tapering.`,details:[`Diazepam 5 mg ×14 was filled.`,`In the later Exhibit 155 kitchen-bottle inventory, 2.5 tablets remained.`,`The 11.5-tablet difference does not establish who removed the tablets, when, whether they followed a taper, or whether Clancy ingested them.`],medication:`Diazepam 5 mg`,source:`SRC-0087; SRC-0048; SRC-0098, Trial Day 12, 00:50:49–00:51:03`,caution:`A bottle count is not an administration record or proof of event-day ingestion.`,views:[`course`]},{id:`ketamine`,date:`2023-01-11T12:00:00`,displayDate:`January 11`,title:`MyChart message: asks about ketamine`,short:`Very low mood; seeks faster relief`,category:`symptom`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`top`,tier:0,summary:`Clancy asked about ketamine and described very low mood, minimal motivation, and desperation for something that might work quickly.`,details:[`Tufts explained the treatment trials typically required before ketamine.`,`The exchange illustrates persistent severe depression despite treatment and improved sleep.`],source:`SRC-0087, Trial Day 9`,views:[`course`]},{id:`traz150`,date:`2023-01-12T12:00:00`,displayDate:`January 12`,title:`Prescription change: trazodone increased`,short:`150 mg ×30 filled`,category:`medication`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`bottom`,tier:1,summary:`Tufts prescribed trazodone 150 mg, and a quantity of 30 was filled.`,details:[`In the later Exhibit 155 kitchen-bottle inventory, 20 tablets remained.`,`The 10-tablet difference does not establish who removed the tablets, when, or whether Clancy ingested them.`,`The evidence does not establish the dose taken every night through January 24.`],medication:`Trazodone 150 mg`,source:`SRC-0091; SRC-0048; SRC-0098, Trial Day 12, 00:50:32–00:50:49`,caution:`A bottle count is not an administration record or proof of adherence.`,views:[`course`]},{id:`jan16`,date:`2023-01-16T12:00:00`,displayDate:`January 16`,title:`Telehealth visit: severe functional depression`,short:`Video visit · very low mood, numbness, forced functioning`,category:`clinical`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`top`,tier:1,summary:`Clancy described very low mood, numbness, forcing herself out of bed, difficulty with basic care, and impaired bonding despite caring for the baby.`,details:[`She denied SI, HI, and psychotic symptoms.`,`She said she could force herself out of bed, attend to hygiene and eating, and care for the baby, although bonding felt forced.`,`Patrick's collateral described her encouraging brunch and sending photos on January 14, appearing ‘pretty good’ at a January 15 water park, and caring for two boys with texts/photos on January 16. These lay observations do not negate the symptoms she reported in treatment.`,`Family texts introduced on Day 13 recorded sleep and ‘a little bit’ of daytime improvement on January 8–12, waiting to feel like herself on January 14, and a January 16 outing described as fun. These are contemporaneous communications, not mental-status examinations.`,`Prescriptions/fills: amitriptyline 10 mg ×30; diazepam 2 mg was dispensed, but the original label quantity remains unresolved.`],civilClaims:[{claim:`The complaint alleges that within a week of McLean discharge she again heard commands including ‘You should harm the children’ and ‘You should kill yourself.’`,source:`SRC-0032 ¶¶70–72`,context:`No pre-offense chart or direct disclosure located through Day 13 documented these voices. The January 16 Tufts encounter recorded severe depression but denials of SI, HI, and psychotic symptoms.`}],source:`SRC-0087, Trial Day 9, pp. 125–126, 06:49:47–06:53:44; SRC-0091, Trial Day 10, pp. 66–67; SRC-0065, 02:30:20–02:39:20; SRC-0099, Trial Day 13, pp. 43–45; compare SRC-0032 ¶¶70–72`,caution:`Organized activity, family messages, and a normal-appearing video encounter neither prove nor exclude symptoms outside those observations.`,views:[`course`]},{id:`jan23`,date:`2023-01-23T12:00:00`,displayDate:`January 23`,title:`Telehealth visit: final pre-offense encounter`,short:`Video visit · depressed, flat; sleep “okay”; SI/HI denied`,category:`clinical`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`bottom`,tier:1,summary:`Clancy reported starting amitriptyline 10 mg without apparent side effects and being down to diazepam 2 mg, with more morning anxiety.`,details:[`She remained depressed, flat, and poorly motivated, although sleep was reportedly okay.`,`Clancy denied SI and HI; Tufts observed appropriate appearance, speech, thought process, cognition, and psychomotor activity, with no mania or psychosis.`,`In a separate text exchange that day, Andrea Hennigan recalled Clancy saying she was no longer in the program and was still working with psychiatrists to find medication permitting sleep and daytime function; Hennigan perceived a hopeful, help-seeking tone and no self-harm concern.`,`A few days before January 24, Amy Bevins recalled Clancy attributing unspecified ‘dark thoughts’ to an unnamed medication while tapering and trying something new; Bevins recalled a hopeful tone and no disclosed self-harm, child-harm desire, or voices.`,`Patrick testified that during January 7–23 morning check-ins Clancy denied suicidal and child-harm thoughts. Her mother wrote on January 22 that it was nice to see Lindsay ‘doing better.’ These collateral observations are not clinical examinations.`,`Phone artifacts showed amitriptyline-related searches continuing through January 23. The search range does not establish dose, adherence, benefit, or adverse effect.`,`Medication changes: amitriptyline increased from 10 to 20 mg; the diazepam taper was slowed, with a 2-mg fill of uncertain quantity.`],civilClaims:[{claim:`The complaint alleges that on January 20 Clancy searched ‘What is a psychopath?’ and that she did not sleep after the January 23 appointment.`,source:`SRC-0032 ¶¶73–74`,context:`Day 13 phone evidence established a different January 20 query—‘can you treat a sociopath?’—not the complaint's quoted wording. No independent evidence established that night's sleep; the January 23 visit recorded sleep as ‘okay.’`}],source:`SRC-0087, Trial Day 9, pp. 126–128, 06:53:15–06:58:17; SRC-0091, Trial Day 10, pp. 67–68; SRC-0084, 01:06:46–01:08:30 and 01:38:48–01:50:02; SRC-0065, 02:26:43–02:27:30; SRC-0099, Trial Day 13, pp. 22–23, 49 and 55; compare SRC-0032 ¶¶73–74`,caution:`These clinician and lay observations are time-limited; text recollections and search artifacts are not psychiatric examinations.`,views:[`course`]},{id:`jan24-sequence`,date:`2023-01-24T17:10:00`,displayDate:`January 24`,title:`January 24: observed sequence`,short:`Family observations · CVS and ThreeV calls · discovery`,category:`event`,evidence:`Mixed evidence`,certainty:`High`,side:`bottom`,tier:1,summary:`The day-of evidence combines a pediatric visit, admitted family messages and photos, spouse collateral, retail-witness testimony, objective phone and map artifacts, errand timestamps, a brief CVS callback with Patrick, and his return-home account.`,sequence:[{time:`8:00–8:42 AM`,title:`Cora's five-year well visit and morning messages`,detail:`Clancy drove Cora alone, exchanged mutually understood texts/photos with Patrick, and returned around 8:30. Pediatrician Lindsay Rosshirt recalled a ‘very normal visit.’ Phone evidence also showed an 8:19 snowman-photo/‘cutie’ exchange and, at 8:42, Lindsay reporting that things were good after Patrick asked how it was going.`,evidence:`Patrick collateral + admitted messages/photos; pediatrician testimony/records; phone extraction · SRC-0065, 02:41:05–02:42:46; SRC-0084, 00:28:14–00:30:51; SRC-0099, pp. 52–54`},{time:`Daytime`,title:`Snow play, crafts and family messages`,detail:`Patrick described snow play and crafts, photos during the day, and happy/playful behavior when he checked in. He recalled no disclosure of SI, child-harm thoughts, or need for help and called it ‘one of her best days.’`,evidence:`Patrick collateral + admitted texts/photos · SRC-0065, 02:42:49–02:45:37`},{time:`4:13 PM`,title:`Apple Maps search for ThreeV`,detail:`The phone extraction recorded a search for the restaurant and a route preview. The forensic witness noted that route previews can vary with traffic.`,evidence:`Objective phone artifact · SRC-0099, p. 30, 02:06:22–02:08:54`},{time:`4:46–4:48 PM`,title:`Constipation-product activity and CVS call`,detail:`Phone artifacts recorded Miralax-for-children activity at 4:46:55, CVS/Pedia-Lax activity at 4:47, and an outgoing CVS Kingston call at 4:48:21. CVS manager Angela Krause described a mutually understood question about a child constipation product and heard no slurring, impairment, or comprehension problem.`,evidence:`Objective phone artifacts + independent sworn retail-witness testimony · SRC-0099, pp. 29–30; SRC-0068, 45:02–47:31`},{time:`4:53–5:15 PM`,title:`Dinner, errand and family messages`,detail:`At 4:53:09, Clancy texted that she had not cooked and it had been a long day; the exchange covered the ThreeV menu, Callan's short nap, meal selections, and the order. Searches continued around 5:06 and she texted ‘PediaLax liquid stool softener’ at 5:15. Patrick described her demeanor at departure as normal.`,evidence:`Patrick testimony + admitted messages + phone extraction · SRC-0065, 02:45:37–02:49:03; SRC-0068, 00:06:02–00:07:12; SRC-0099, pp. 30–33`},{time:`5:09–5:10 PM`,title:`Calls associated with the food order`,detail:`The extraction recorded calls lasting 11 seconds at 5:09 and 47 seconds at 5:10; the forensic witness recalled the latter as the ThreeV number. Hostess Saria Sweeney separately recalled a routine order for risotto and a Mediterranean power bowl, with coherent answers to order questions.`,evidence:`Objective phone artifacts + independent sworn retail-witness testimony · SRC-0099, pp. 32–33; SRC-0068, 49:57–52:40`},{time:`5:32–5:37 PM`,title:`Patrick at CVS`,detail:`Sworn investigator testimony and the warrant chronology place Patrick inside CVS from 5:32:32 until 5:37:08.`,evidence:`Investigator testimony + objective timestamp chronology · SRC-0084, 02:16:24–02:18:21; SRC-0010, pp. 168–169`},{time:`5:33–5:34 PM`,title:`Patrick and Lindsay speak from CVS`,detail:`Phone evidence recorded further calls in this interval. Patrick testified that his first call went unanswered and Lindsay called back about a minute later; when he asked whether a generic substitute was acceptable, she said yes. He described her as quiet and sounding busy, while saying they understood each other and she remembered what he was seeking.`,evidence:`Objective phone artifacts + Patrick sworn percipient/collateral testimony · SRC-0099, p. 33; SRC-0068, 00:08:56–00:10:15`},{time:`5:54–5:55 PM`,title:`Patrick at ThreeV`,detail:`Objective chronology places Patrick entering at 5:54:14 and paying/leaving at 5:55:01.`,evidence:`Investigator testimony + objective timestamp chronology · SRC-0084, 02:16:24–02:18:21; SRC-0010, pp. 168–169`},{time:`By ~6:09 PM`,title:`Quiet house and unanswered call`,detail:`Patrick returned to an unusually quiet house, called out and yelled down the basement stairs, telephoned Clancy without an answer, and checked upstairs before finding the locked bedroom.`,evidence:`Patrick sworn testimony · SRC-0068, 00:19:49–00:22:42`},{time:`~6:11 PM onward`,title:`Discovery and emergency response`,detail:`After finding Clancy outside, Patrick testified that she said, ‘I tried to kill myself’ and ‘They're in the basement.’ He had difficulty connecting to 911, stayed on the call, and first responders arrived about four to five minutes later.`,evidence:`Patrick testimony + officer dispatch time · SRC-0068, 00:28:19–00:32:02; SRC-0071, 00:04:12–00:04:37`}],details:[`Each encounter is a narrow observation, not a psychiatric examination; coherent calls and organized behavior at particular moments do not exclude psychosis or establish criminal responsibility.`,`The pediatrician's ‘very normal visit’ describes a brief pediatric encounter in the morning, not mental state later in the day.`,`The new extraction corroborates specific phone activity and timing; it does not determine why an action occurred, who was present during every interaction, or what Clancy's mental state was.`,`Patrick's inference that she was ‘probably giving baths’ was not something he directly observed.`,`The investigator's claim that the errands created an opportunity is a probable-cause allegation, not a judicial finding.`,`The suicide attempt is evidence of acute distress but does not by itself establish diagnosis, psychosis, or legal insanity.`],civilClaims:[{claim:`The complaint alleges nonstop suicidal and later child-harm commands that day; checking a map to avoid being alone and obtain help; a final demanding male voice after Patrick left; compulsion, dreamlike dissociation, and ingestion of an unspecified quantity of medication during the attempt.`,source:`SRC-0032 ¶¶75–83`,context:`These are retrospective plaintiff allegations. Through Day 13, partial sworn corroboration remained limited to Patrick's report that about a week later Clancy described a male voice saying she would lose her chance if she did not act then; his account did not include children in that disclosure. The phone extraction establishes the map, call, and message artifacts—not the complaint's claimed motive or voice account.`}],source:`SRC-0065; SRC-0068; SRC-0071; SRC-0084; SRC-0010; SRC-0099, Trial Day 13, pp. 29–33 and 52–54; compare SRC-0032 ¶¶75–83`,caution:`The evidence derives from different sources: family collateral, brief clinical or retail observations, phone artifacts, objective timestamps, attorney theories, and civil allegations are not interchangeable.`,views:[`course`]},{id:`jan26`,date:`2023-01-26T12:00:00`,displayDate:`January 26`,title:`Brigham psychiatric consultation`,short:`Horrified but linear; no psychosis in snapshot`,category:`post`,evidence:`Treating testimony`,certainty:`High`,clinician:`Jhilam Biswas, MD`,institution:`Brigham and Women’s Hospital`,side:`top`,tier:0,summary:`While intubated and writing responses, Clancy described her mood as ‘horrified,’ asked whether she had an attorney, and asked about her body and legs.`,details:[`Biswas found linear communication and no psychosis during a 20–30-minute assessment.`,`She conceded that psychosis can fluctuate and that a person may have moments of clarity.`],source:`SRC-0078, Trial Day 5, 2:02:12–2:13:31`,caution:`This was approximately 1.5 days later and was not an offense-time forensic examination.`,views:[`post`]},{id:`hospital-voice-theory`,date:`2023-01-27T12:00:00`,displayDate:`Late January (approx.)`,title:`Investigative discussion: voice-prompting theory unsupported`,short:`Hospital-room conversation not overheard · no firsthand basis`,category:`post`,evidence:`Retrospective report`,certainty:`Contested`,institution:`Brigham and Women’s Hospital / Massachusetts State Police`,side:`bottom`,tier:2,summary:`A state-police witness recalled that investigators discussed a theory that a court-authorized defense clinician had suggested Clancy report hearing voices, but the witness had no firsthand knowledge or report supporting it.`,details:[`Sergeant Daniel Lawler saw the clinician enter Clancy's hospital room but did not enter, listen, or know what was said.`,`Lawler later learned that Clancy used the clinician's phone to call Patrick and recalled discussing the reported voice statement with lead investigator Joshua McKelligan.`,`Before the jury, Lawler agreed that the prompting theory had no investigative basis and characterized it as McKelligan's speculation; he reiterated that he heard nothing in the room.`,`The clinician visit was estimated as two or three days after January 24; its exact date remains approximate.`],source:`SRC-0098, Trial Day 12, voir dire 01:03:40–01:31:57; jury testimony 01:46:56–01:52:42`,caution:`Investigators discussed an unsupported prompting theory; the witness provided no basis for concluding that a clinician planted, coached, or prompted the hallucination account.`,views:[`post`]},{id:`delirium`,date:`2023-01-29T12:00:00`,displayDate:`January 29–30`,title:`Transient postoperative delirium`,short:`Confusion and visual hallucinations resolve`,category:`post`,evidence:`Treating testimony`,certainty:`High`,clinician:`Sejal Shah, MD`,institution:`Brigham and Women’s Hospital`,side:`bottom`,tier:0,summary:`Shah identified postoperative delirium with confusion and visual hallucinations amid anesthesia, oxygen desaturation, tachycardia, and acute medical illness.`,details:[`The delirium cleared by the following day.`,`This postoperative delirium occurred days later and does not establish Clancy's mental state on January 24.`],source:`SRC-0078, 1:29:04–1:32:45`,views:[`post`]},{id:`voice`,date:`2023-01-31T12:00:00`,displayDate:`~1 week later`,title:`Male command voice first disclosed`,short:`Retrospective statement to Patrick`,category:`post`,evidence:`Retrospective report`,certainty:`Contested`,side:`top`,tier:1,summary:`Patrick testified that Clancy told him she heard a male voice saying that if she did not act then, she would lose her chance.`,details:[`This is the first positive voice account located in the trial record.`,`No located pre-offense clinician note documents the voice.`,`The more elaborate command/compulsion account appears later in the civil complaint.`],source:`SRC-0068, 37:13–38:25`,caution:`Moderate confidence that the statement was made; contested as proof of an offense-time hallucination.`,views:[`post`]},{id:`feb`,date:`2023-02-20T12:00:00`,displayDate:`February 19–21`,title:`Rehabilitation-oriented follow-up`,short:`SI/HI/AH/VH denied`,category:`post`,evidence:`Treating testimony`,certainty:`High`,clinician:`Sejal Shah, MD`,side:`bottom`,tier:1,summary:`Shah documented orientation and future orientation toward rehabilitation, denial of SI, HI, and hallucinations, and feeling down about paralysis and the events.`,details:[`These are later treatment snapshots, not opinions about mental state during the alleged offenses.`],source:`SRC-0078, 1:40:36–1:43:03`,views:[`post`]},{id:`tox`,date:`2023-04-14T12:00:00`,displayDate:`February–April 2023`,title:`Toxicology reports`,short:`Six psychiatric agents or metabolites detected`,category:`post`,evidence:`Objective record`,certainty:`High`,side:`top`,tier:2,summary:`Case specimens detected diazepam/metabolites, lorazepam, trazodone, mirtazapine, lamotrigine, and quetiapine/metabolite.`,details:[`The corrected report lists January 24 as the collection date but gives no collection time.`,`The detected list did not cleanly match the intended outpatient medication list.`,`Detection does not establish prescribed dose, exact ingestion time, adherence, impairment, psychiatric effect, or causation.`],source:`SRC-0008; SRC-0039; SRC-0082`,caution:`The civil complaint alleges unspecified event-day ingestion, further limiting inference about routine use.`,views:[`post`]},{id:`spinelli`,date:`2024-06-11T12:00:00`,displayDate:`June & September 2024`,title:`Spinelli forensic evaluations`,short:`Bipolar/psychosis opinion attributed in civil pleading`,category:`post`,evidence:`Civil allegation`,certainty:`Contested`,clinician:`Margaret Spinelli, MD`,side:`bottom`,tier:0,summary:`The civil complaint says Spinelli conducted a five-hour evaluation in June and a three-hour telephone evaluation in September, with collateral interviews.`,details:[`The complaint attributes a bipolar-I/psychosis/postpartum-onset formulation and antidepressant-activation opinions to her.`,`The complete report, testing, raw interviews, and testimony are not publicly available.`],source:`SRC-0032 ¶¶84–88`,caution:`Selected pleading quotations are not the expert report and are not adjudicated findings.`,views:[`post`]}],te=[{id:`surface-aug23`,date:`2022-08-23T09:45:00`,displayDate:`August 23`,title:`Shared-device browser path: user unresolved`,short:`Surface Pro artifacts · Tom T. Hall to suicide-methods page`,category:`digital`,evidence:`Objective record`,certainty:`Contested`,side:`top`,tier:1,summary:`A forensic image of a shared Surface Pro recorded a navigation path from a Facebook page and Tom T. Hall material, through a hyperlink about his death, to a Wikipedia suicide-methods section and then the Grafton Bridge page.`,details:[`The sequence ran approximately 9:40–9:48 a.m.; the artifact did not establish dwell time.`,`The defense elicited that the suicide-methods page was reached through hyperlinks rather than a typed ‘methods of suicide’ query.`,`The examiner could not identify the human user. The Surface Pro belonged to Patrick, and a browser artifact displayed his email address, but neither fact proves who was browsing at the relevant time.`,`The defense introduced pediatric appointments for Callan and Dawson that morning as circumstantial context about Lindsay's activities; the examiner did not know of those appointments.`],source:`SRC-0099, Trial Day 13, pp. 6–15, 00:59:17–01:28:40`,caution:`The examiner could not identify the user. The browsing path establishes device activity but not attribution, diagnosis, or intent.`,views:[`course`]},{id:`phone-note-oct25`,date:`2022-10-25T18:00:00`,displayDate:`October 25 / November 3`,title:`Phone note: depression, connection, and sleep fears`,short:`Created Oct. 25 · last modified Nov. 3`,category:`digital`,evidence:`Contemporaneous record`,certainty:`Moderate`,side:`top`,tier:2,summary:`A note on Clancy's phone, created October 25 and last modified November 3, recorded her own reflections on depression, parenting, connection with Callan, sleep deprivation, and whether to begin medication.`,details:[`She wrote that she felt sad or depressed, had stopped breastfeeding, and felt less connected to Callan than she had hoped.`,`She described some resentment toward the older children, immediately recognized that it was unfair, and wrote that she wanted love and connection with all three children.`,`She wanted eight hours of sleep, therapy, and to feel happy and relaxed; she wrote that she felt traumatized only when ‘severely sleep-deprived and paranoid.’`,`She feared that something could happen to the children or that mistakes could harm their development.`,`The extraction could not identify what changed on November 3; the modification could have involved one character or the entire note.`],source:`SRC-0099, Trial Day 13, pp. 23–26, 01:49:04–01:56:10`,caution:`This is contemporaneous self-report, not a clinician assessment. ‘Paranoid’ is Clancy's own word in a private note and does not by itself establish delusional paranoia or psychosis.`,views:[`course`]},{id:`phone-search-dec29`,date:`2022-12-29T09:00:00`,displayDate:`December 29–31`,title:`Phone searches: McLean, suicide, bipolarity, and sleep`,short:`Extracted search artifacts · clinical meaning unresolved`,category:`digital`,evidence:`Objective record`,certainty:`High`,side:`top`,tier:3,summary:`The iPhone extraction recorded searches or related artifacts involving McLean, suicide, bipolar disorder, trazodone, Ativan, and insomnia during the days leading to McLean admission.`,details:[`December 29: McLean at 8:52 a.m.; bipolar-related artifacts beginning at 9:00 a.m.; and suicide at 1:02 p.m.`,`December 31: trazodone entries from about 4:08–7:07 p.m.; an Ativan entry at 7:06 p.m.; and insomnia at 7:12 p.m.`,`The bipolar-related artifact range continued through January 13; the search display does not establish which pages were read or how their contents were interpreted.`],source:`SRC-0099, Trial Day 13, pp. 45–49, 03:33:20–03:42:38`,caution:`Search terms are evidence of phone activity, not a diagnosis, prescription, dose, ingestion, adverse effect, clinician recommendation, or criminal-responsibility conclusion.`,views:[`course`]},{id:`mclean-text-jan3`,date:`2023-01-03T08:35:00`,displayDate:`January 3`,title:`Family texts from McLean: anxiety about team and discharge`,short:`Phone messages · worried she would not be sent home soon`,category:`digital`,evidence:`Objective record`,certainty:`High`,side:`bottom`,tier:2,summary:`In a family text thread introduced through the phone extraction, Clancy said she was all right but anxious about meeting the full psychiatry team and worried that they would not send her home soon.`,details:[`The messages were sent at approximately 8:35 and 8:37 a.m.`,`The forensic witness understood the thread to place her at McLean, but that location was his recollection or inference from the conversation rather than a device-location finding.`,`The messages add patient-reported context to the known voluntary admission; they are not a clinician observation or proof that discharge criteria had been met.`],source:`SRC-0099, Trial Day 13, pp. 42–43, 03:24:24–03:25:54`,caution:`Wanting to go home or worrying about discharge is not equivalent to demanding discharge, leaving against medical advice, or being clinically ready for discharge.`,views:[`course`]},{id:`new-med-text-jan18`,date:`2023-01-18T11:26:00`,displayDate:`January 18`,title:`Text: reports starting an unnamed ‘new med’`,short:`Says she began it two nights earlier · drug and dose unknown`,category:`digital`,evidence:`Objective record`,certainty:`High`,side:`bottom`,tier:2,summary:`When her mother asked about a ‘new med,’ Clancy replied that she had started it two nights earlier.`,details:[`The text supports a patient self-report of starting some medication around January 16.`,`Neither the message nor the testimony identified the drug, dose, prescriber, number of doses, benefit, adverse effects, or continued use.`,`Amitriptyline was separately prescribed on January 16 and later reported to Tufts on January 23, but the record does not establish that it was the unnamed medication in this text.`],medication:`Unnamed ‘new med’: reportedly started two nights earlier`,source:`SRC-0099, Trial Day 13, p. 45, 03:30:44–03:31:19`,caution:`The text does not identify the medication or dose; attribution to amitriptyline remains unconfirmed.`,views:[`course`]},{id:`phone-search-jan19`,date:`2023-01-19T10:00:00`,displayDate:`January 19–20`,title:`Phone searches: psychosis, medications, and withdrawal`,short:`Extracted search artifacts · not symptoms or diagnoses`,category:`digital`,evidence:`Objective record`,certainty:`High`,side:`top`,tier:2,summary:`The phone extraction recorded a dense cluster of mental-health and medication-related searches on January 19–20, including schizophrenia, hallucinations, psychosis symptoms, benzodiazepine withdrawal, ketamine, and a sociopathy query.`,details:[`January 19: schizophrenia at 9:58 a.m., hallucinations at 10:33 a.m., and a ‘psychosis symptoms’ search.`,`January 20: ‘benzo withdrawals’ at 8:11 p.m.; ‘can you treat a sociopath?’ at 8:28 p.m.; and psychosis/ketamine artifacts around 8:39 p.m.`,`One January 20 query referred to being ‘on Seroquel’ and feeling unable to have a conversation; an ‘intrusive’ artifact was also shown, but its full query was not established.`,`A single search may appear in multiple forensic-tool categories, so repeated rows are not necessarily separate user actions.`],source:`SRC-0099, Trial Day 13, pp. 22–23 and 45–55, 01:46:45–01:48:56 and 03:33:20–03:56:33`,caution:`Searches can reflect distress, curiosity, self-assessment, medication concerns, or many other motives. They do not establish that the searched condition was present or that any named drug was prescribed or taken.`,views:[`course`]},{id:`sep12-forms`,date:`2022-09-12T12:00:00`,displayDate:`September 12`,title:`Online intake forms completed`,short:`Pre-visit symptom and safety screening—not an appointment`,category:`clinical`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`bottom`,tier:0,summary:`Clancy completed intake materials three days before her first Tufts evaluation.`,details:[`The forms preceded the September 15 clinical assessment.`,`Later testimony described anxiety, depressive symptoms, insomnia, and racing thoughts, with negative suicide, harm, voice, and psychosis items.`],source:`SRC-0087, Trial Day 9, 03:38:39–04:06:46`,caution:`The forms and the clinician encounter occurred on different dates.`,views:[`course`]},{id:`rx-sep15`,date:`2022-09-15T15:00:00`,displayDate:`September 15`,title:`Prescription: sertraline`,short:`25 mg daily, then planned 50 mg · 25 mg ×30 filled`,category:`medication`,evidence:`Objective record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`bottom`,tier:2,summary:`Tufts prescribed sertraline 25 mg daily for one week, then 50 mg; the pharmacy exhibit records a same-day 25 mg quantity-30 fill.`,details:[`Indication was anxiety/depressive symptoms.`,`Clancy later reported that she did not begin the medication on this date.`],medication:`Zoloft (sertraline) 25 mg prescribed/filled; 50 mg planned`,source:`SRC-0087, 04:03:55–04:06:46; SRC-0048, Sept. 15 row`,caution:`Prescribed and filled do not establish ingestion.`,views:[`course`]},{id:`sep28-visit`,date:`2022-09-28T10:00:00`,displayDate:`September 28`,title:`Telehealth follow-up: symptoms improving`,short:`Video visit · baby sleeping more; sertraline not started`,category:`clinical`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`top`,tier:2,summary:`At her second Tufts video visit, Clancy reported feeling somewhat better as the baby slept more, allowing her to sleep more. She said she had picked up sertraline but decided not to take it.`,details:[`Tufts described her as alert, oriented, appropriately dressed and engaged, with euthymic mood, full affect, appropriate speech and thought, excellent judgment, intact cognition, and normal psychomotor activity.`,`No hallucinations were reported.`,`Medication decision: sertraline remained deferred; Clancy reported no doses taken.`],source:`SRC-0087, Trial Day 9, pp. 98–102, 05:33:09–05:42:45; SRC-0091, Trial Day 10, pp. 12–13`,caution:`The mental-status findings reflect this time-limited video encounter.`,views:[`course`]},{id:`oct3-visit`,date:`2022-10-03T12:00:00`,displayDate:`October 3`,title:`Telehealth visit: leave paperwork`,short:`Video visit · postpartum leave documentation reviewed`,category:`clinical`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`bottom`,tier:2,summary:`Clancy met with Tufts by video after requesting help with paperwork to extend her maternity leave for postpartum anxiety and depression.`,details:[`Tufts testified that the mental-status examination did not show a notable change from September 28.`,`The appointment appears to have been scheduled after Tufts advised that the paperwork required information best reviewed together.`],source:`SRC-0087, Trial Day 9, pp. 102–105, 05:42:50–05:52:52; SRC-0091, Trial Day 10, pp. 12–13`,caution:`This encounter documented functional and administrative follow-up, not a new independent diagnosis.`,views:[`course`]},{id:`oct3-therapy`,date:`2022-10-03T16:00:00`,displayDate:`October 3`,title:`Therapy intake: first McAllister assessment`,short:`Separate same-day encounter · complete therapy chart unavailable`,category:`clinical`,evidence:`Treating testimony`,certainty:`High`,clinician:`Jennifer McAllister`,institution:`Aster Mental Health`,side:`top`,tier:3,summary:`After the Tufts video visit, Clancy had her first documented therapy encounter with Jennifer McAllister.`,details:[`Tufts identified the encounter from Exhibit 219 during testimony but was not present for it.`,`The complete McAllister therapy record is not publicly available, limiting reconstruction of its symptom and safety content.`],source:`SRC-0087, Trial Day 9, pp. 102–104, 05:47:11–05:52:52; Exhibit 219 p. 57`,caution:`This establishes the encounter and sequence; it is not a substitute for the missing therapy note.`,views:[`course`]},{id:`med-oct20`,date:`2022-10-20T15:00:00`,displayDate:`October 20`,title:`Medication decision: sertraline stopped`,short:`After video visit · switch deferred; supplements discussed`,category:`medication`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`top`,tier:1,summary:`Tufts advised Clancy to stop sertraline after the adverse-symptom report. Clancy did not want to start another prescription medication immediately.`,details:[`Tufts discussed possible alternatives and natural supplements because Clancy was reluctant to begin another prescription.`,`The exact sertraline start date and number of doses remain uncertain.`,`Later history to Jollotta described roughly 48 hours without sleep and without fatigue; Jollotta called that an activating response.`],medication:`Zoloft (sertraline) stopped; replacement prescription deferred`,source:`SRC-0087, Trial Day 9, pp. 105–109, 05:52:52–06:00:08; SRC-0091, Trial Day 10, pp. 42–45; SRC-0096, Trial Day 11, pp. 46–50`,caution:`Temporal association supports concern but does not prove a bipolar switch or medication causation.`,views:[`course`]},{id:`rx-oct21`,date:`2022-10-21T15:00:00`,displayDate:`October 21`,title:`Prescription: lorazepam`,short:`0.5 mg ×7 · PRN severe anxiety`,category:`medication`,evidence:`Objective record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`bottom`,tier:1,summary:`Tufts prescribed and the pharmacy dispensed seven 0.5-mg lorazepam tablets for severe anxiety after the sertraline-associated symptom report.`,details:[`The intended use was short-term and as needed.`],medication:`Ativan (lorazepam) 0.5 mg ×7 prescribed/filled`,source:`SRC-0091, 01:52:33–01:58:48; SRC-0048`,caution:`The number swallowed is not established.`,views:[`course`]},{id:`rx-oct26`,date:`2022-10-26T15:00:00`,displayDate:`October 26`,title:`Prescriptions: anxiety regimen`,short:`Lorazepam 1 mg · buspirone 5 mg · hydroxyzine 25 mg`,category:`medication`,evidence:`Objective record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`top`,tier:3,summary:`The pharmacy exhibit records three same-day fills as Tufts broadened the anxiety regimen.`,details:[`Lorazepam 1 mg ×30.`,`Buspirone 5 mg ×30 for daily use.`,`Hydroxyzine 25 mg ×30 as a non-benzodiazepine option before lorazepam.`],medication:`Lorazepam 1 mg; buspirone 5 mg; hydroxyzine 25 mg`,source:`SRC-0091, 05:37:28–05:38:34; SRC-0048`,caution:`The fills do not establish concurrent or subsequent use; buspirone was later reported not started.`,views:[`course`]},{id:`rx-nov2`,date:`2022-11-02T16:00:00`,displayDate:`November 2`,title:`Prescription/refill: lorazepam`,short:`0.5 mg ×40 · gradual taper planned`,category:`medication`,evidence:`Objective record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`top`,tier:2,summary:`Lorazepam 0.5 mg quantity 40 was filled while Tufts planned 0.25-mg reductions every two weeks.`,details:[`Clancy reported benefit from lorazepam at the associated visit.`,`Completion of the taper was not established.`],medication:`Ativan (lorazepam) 0.5 mg ×40 filled`,source:`SRC-0087, 06:11:43–06:16:20; SRC-0048`,caution:`A taper plan is not proof of the doses actually used.`,views:[`course`]},{id:`rx-nov9`,date:`2022-11-09T12:00:00`,displayDate:`November 9`,title:`Pharmacy fill: buspirone`,short:`5 mg ×30 · later adherence unresolved`,category:`medication`,evidence:`Objective record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`bottom`,tier:2,summary:`A second buspirone 5-mg quantity-30 fill appears in the pharmacy exhibit.`,details:[`On November 2 Clancy had reported that she had not started buspirone because she feared beginning a new medication.`,`The later fill does not resolve whether she ever took it.`],medication:`Buspar (buspirone) 5 mg ×30 filled`,source:`SRC-0048, Nov. 9 row; SRC-0087, 06:11:23–06:12:04`,caution:`Filled does not equal taken.`,views:[`course`]},{id:`rx-nov16`,date:`2022-11-16T17:00:00`,displayDate:`November 16`,title:`Prescription: trazodone`,short:`50 mg ×30 after South Shore ED visit`,category:`medication`,evidence:`Objective record`,certainty:`High`,clinician:`Kayvon Izadpanah, MD`,institution:`South Shore Health`,side:`bottom`,tier:3,summary:`Trazodone 50 mg quantity 30 was filled after the emergency-department encounter.`,details:[`Clancy later reported that it helped her fall asleep but did not maintain sleep.`],medication:`Desyrel (trazodone) 50 mg ×30 filled`,source:`SRC-0048, Nov. 16 row; SRC-0091, 06:17:49–06:19:48`,caution:`The duration and regularity of use are unknown.`,views:[`course`]},{id:`paul-contact`,date:`2022-11-20T12:00:00`,displayDate:`November 20`,title:`Phone call: first perinatal service contact`,short:`Personal-phone outreach · sleep history reviewed`,category:`clinical`,evidence:`Treating testimony`,certainty:`High`,clinician:`Julie Paul, psychiatric NP`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:2,summary:`After Sue Clancy initiated contact following a referral, Paul confirmed Lindsay's permission and called her personally before the formal November 21 intake.`,details:[`Sue had only indicated that Lindsay was struggling; Lindsay herself supplied the symptom history.`,`Clancy described an initially well 12 weeks, then anxiety after Patrick returned to work, difficulty leaving the baby, overwhelm, racing thoughts, fragmented sleep, and a wish to avoid long-term medication.`,`Paul screened self-harm, baby/child harm, HI, auditory/visual hallucinations, and immediate safety; the responses were negative.`,`Clancy reported prior sertraline use and that lorazepam plus diphenhydramine had been most helpful for sleep. Paul advised using the existing combination that night and scheduled the next-day intake.`],source:`SRC-0091, Trial Day 10, pp. 91–94, 06:15:01–06:23:19`,caution:`This reflects the history Clancy gave the service and a time-limited safety screen, not independent confirmation of every earlier symptom or dose.`,views:[`course`]},{id:`rx-nov21`,date:`2022-11-21T15:00:00`,displayDate:`November 21`,title:`Prescription: fluoxetine`,short:`10 mg ×56 · selected from prior reported benefit`,category:`medication`,evidence:`Objective record`,certainty:`High`,clinician:`Julie Paul, psychiatric NP`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:3,summary:`Paul prescribed fluoxetine 10 mg and a quantity of 56 was filled.`,details:[`The selection relied on Clancy's report of prior benefit.`,`Later evidence describes only a short trial before discontinuation.`],medication:`Prozac (fluoxetine) 10 mg ×56 prescribed/filled`,source:`SRC-0091, 06:23:24–06:33:23; SRC-0048`,caution:`The quantity dispensed does not show how many doses were taken.`,views:[`course`]},{id:`tufts-nov22`,date:`2022-11-22T12:00:00`,displayDate:`November 22`,title:`Telehealth follow-up: transfer of care discussed`,short:`Video visit · South Shore enrollment and medications reviewed`,category:`clinical`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`bottom`,tier:2,summary:`At a Tufts video visit, Clancy reported that she had enrolled with South Shore's perinatal mental-health service and planned to transfer psychiatric and therapy care there.`,details:[`She reported plans to start fluoxetine and continued use of lorazepam and diphenhydramine for sleep as needed.`,`She denied SI and HI, and Tufts observed no psychosis.`,`They also discussed a return-to-work letter.`],source:`SRC-0087, Trial Day 9, pp. 113–114, 06:16:20–06:19:11; SRC-0091, Trial Day 10, pp. 39–40`,caution:`The medication history was Clancy's report to Tufts; fluoxetine 10 mg ×56 had been prescribed and filled on November 21.`,views:[`course`]},{id:`fluoxetine-start-report`,date:`2022-11-23T12:00:00`,displayDate:`November 22–23`,title:`Message/phone exchange: fluoxetine start confirmed`,short:`Communication medium unresolved · nervousness addressed`,category:`medication`,evidence:`Treating testimony`,certainty:`Moderate`,clinician:`Julie Paul, psychiatric NP`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:3,summary:`Clancy contacted Paul on November 22 because she was nervous about starting fluoxetine; Paul encouraged the trial. On November 23 Clancy reported that she had started it the day before.`,details:[`Paul could not recall whether the exchange occurred by phone or MyChart.`,`This is patient-reported ingestion beginning November 22 and is stronger than the November 21 dispensing row alone.`],medication:`Prozac (fluoxetine) 10 mg reportedly started November 22`,source:`SRC-0091, Trial Day 10, pp. 101–102, 06:39:52–06:41:19`,caution:`The communication supports a reported start date, not continuous adherence or causation.`,views:[`course`]},{id:`rx-nov25`,date:`2022-11-25T15:00:00`,displayDate:`November 25`,title:`Prescriptions: revised sleep regimen`,short:`Zolpidem 5 mg · mirtazapine 7.5 mg · clonazepam 0.5 mg`,category:`medication`,evidence:`Objective record`,certainty:`High`,clinician:`Julie Paul, psychiatric NP`,institution:`South Shore Perinatal Behavioral Health`,side:`bottom`,tier:3,summary:`Three prescriptions were dispensed during a rapid change in the sleep regimen.`,details:[`Zolpidem 5 mg ×1 for a one-dose trial.`,`Mirtazapine 7.5 mg ×30.`,`Clonazepam 0.5 mg ×14; Paul warned not to combine it with lorazepam.`],medication:`Ambien 5 mg; Remeron 7.5 mg; Klonopin 0.5 mg`,source:`SRC-0091, 06:40:43–06:45:00; SRC-0048`,caution:`Zolpidem ingestion is unproved; later messages support only specified mirtazapine/clonazepam nights.`,views:[`course`]},{id:`msg-nov26`,date:`2022-11-26T12:00:00`,displayDate:`November 26`,title:`MyChart message: sleep after new regimen`,short:`Reports mirtazapine 7.5 mg + clonazepam 0.5 mg`,category:`medication`,evidence:`Reported to clinician`,certainty:`High`,clinician:`Julie Paul, psychiatric NP`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:3,summary:`Clancy reported taking mirtazapine 7.5 mg with clonazepam 0.5 mg and sleeping, and asked about trying 15 mg mirtazapine.`,details:[`This is patient-reported ingestion for one specific night.`],medication:`Remeron 7.5 mg + Klonopin 0.5 mg reportedly taken`,source:`SRC-0091, 06:45:21–06:46:33`,caution:`It does not establish a continuous regimen.`,views:[`course`]},{id:`msg-nov29`,date:`2022-11-29T09:00:00`,displayDate:`November 29`,title:`MyChart message: slight sleep benefit`,short:`Reports mirtazapine 15 mg + CBD`,category:`medication`,evidence:`Reported to clinician`,certainty:`High`,clinician:`Julie Paul, psychiatric NP`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:2,summary:`Before the Jollotta visit, Clancy reported mirtazapine 15 mg plus CBD with only slight sleep benefit.`,details:[`The CBD product and dose are unknown.`],medication:`Remeron 15 mg + CBD reportedly taken`,source:`SRC-0091, 06:49:51–06:50:41`,caution:`Patient report; the product and causal effects were not independently established.`,views:[`course`]},{id:`rx-nov30`,date:`2022-11-30T18:00:00`,displayDate:`November 30`,title:`Prescription: quetiapine`,short:`25 mg ×30 · low-dose sleep intervention`,category:`medication`,evidence:`Objective record`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:2,summary:`Jollotta prescribed quetiapine 25 mg and the pharmacy exhibit records a quantity-30 fill.`,details:[`The stated target at this dose was insomnia.`],medication:`Seroquel (quetiapine) 25 mg ×30 prescribed/filled`,source:`SRC-0096, pp. 28–30; SRC-0048`,caution:`This low-dose prescription does not itself establish a bipolar or psychotic diagnosis or immediate ingestion.`,views:[`course`]},{id:`tufts-dec1`,date:`2022-12-01T16:00:00`,displayDate:`December 1`,title:`Telehealth follow-up: fears approaching SI`,short:`Video visit · medication history reviewed`,category:`clinical`,evidence:`Treating testimony`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`bottom`,tier:2,summary:`At a Tufts video appointment, Clancy denied active suicidal ideation but described fear of getting close to suicidal thoughts and said she was not improving.`,details:[`She reviewed recent sleep-medication trials and side effects as she understood them.`,`Lamotrigine was discussed but not prescribed that day.`,`She reported having started mirtazapine and was uncertain whether quetiapine had begun.`],source:`SRC-0087, Trial Day 9, pp. 114–119, 06:19:11–06:31:40; SRC-0091, Trial Day 10, pp. 53–54`,caution:`The medication history was Clancy's self-report during this Tufts video encounter.`,views:[`course`]},{id:`dec1-urgent-outreach`,date:`2022-12-01T18:00:00`,displayDate:`December 1`,title:`Primary-care outreach: urgent appointment sought`,short:`Voicemail/MyChart outreach · completed visit unresolved`,category:`clinical`,evidence:`Treating testimony`,certainty:`Moderate`,institution:`South Shore Health`,side:`top`,tier:3,summary:`A shared-network note indicated that Clancy requeste
