d an immediate nurse-practitioner medication appointment; an emergency slot was offered, but staff did not reach her in time to complete it.`,details:[`Jollotta testified that, to her knowledge, no appointment occurred.`,`On later questioning she could not confirm whether a separate Christina Zappi entry represented a completed visit.`],source:`SRC-0096, Trial Day 11, p. 32, 01:47:27–01:48:24 and 06:12:23–06:13:25`,caution:`This is an outreach attempt, not a confirmed clinical encounter; exact modality and completion remain unresolved.`,views:[`course`]},{id:`dec2-dukes`,date:`2022-12-02T15:00:00`,displayDate:`December 2`,title:`In-person LMHC intake: postpartum symptoms`,short:`~1 hour · anxiety, depression, sleep loss, passive SI`,category:`clinical`,evidence:`Treating testimony`,certainty:`High`,clinician:`Latiesha Dukes, LMHC`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:3,summary:`At a fresh in-person intake, Clancy reported anxiety, depressive symptoms, severe sleep loss, and frequent passive suicidal ideation—wanting to die or no longer be present—without a plan.`,details:[`Dukes observed low mood, numbness, and tearfulness while anxiety was discussed; thought process and intellectual functioning were within normal limits.`,`Clancy reported constant fear that something bad would happen to the children, especially the baby, as well as panic, poor attention or confusion, 2–4 hours of sleep, appetite loss, and about 10 pounds of weight loss in one month.`,`Clancy worried that she had an Ativan addiction. Dukes's substance-use assessment did not identify a substance-use disorder, and she understood Clancy to be using it as directed for anxiety.`,`Clancy reported recent mirtazapine and quetiapine prescriptions that were not helping sleep and lorazepam use on December 1 after intrusive suicidal thoughts. Dukes did not independently reconcile the auto-populated medication list.`,`Dukes formulated postpartum anxiety and planned weekly bridge therapy, continued prescriber management, IOP/PHP connection, CBT resources, and crisis/ER instructions.`],source:`SRC-0098, Trial Day 12, 02:01:43–02:14:00; cross 03:04:34–03:22:44`,caution:`Symptoms and medication use were patient reports documented by a treating LMHC. The encounter does not establish exact doses, active-medication reconciliation, medication causation, or risk outside this assessment.`,views:[`course`]},{id:`dec5-aspire`,date:`2022-12-05T14:00:00`,displayDate:`December 5`,title:`Telehealth LMHC follow-up: after Aspire contact`,short:`~30 minutes · current SI denied · IOP/PHP recommended`,category:`clinical`,evidence:`Treating testimony`,certainty:`High`,clinician:`Latiesha Dukes, LMHC`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:2,summary:`Clancy told Dukes that a difficult weekend of continuous intrusive thoughts of wanting to die or not be present led to a virtual Aspire crisis evaluation; at the December 5 follow-up, she denied current suicidal ideation.`,details:[`Clancy reported that Aspire found she did not meet inpatient criteria because she lacked a suicide plan and recommended a day program.`,`Dukes did not observe psychosis, mania, homicidal ideation, delusions, or paranoia and did not assess an immediate crisis during this visit.`,`Patrick joined the video visit. Dukes recommended IOP/PHP-level care and reviewed sleep hygiene; Clancy was interested rather than declining.`,`Clancy requested psychological testing for additional diagnostic and medication input.`],civilClaims:[{claim:`The complaint labels a weekend crisis contact a New Bedford Suicide Hotline call prompted by hallucinations.`,source:`SRC-0032 ¶45`,context:`Dukes directly testified only to Clancy's report of a virtual Aspire evaluation after continuous suicidal thoughts. The underlying Aspire record, exact service identity, and alleged hallucination content remain unavailable.`}],source:`SRC-0098, Trial Day 12, 02:14:00–02:23:15; cross 03:23:49–03:25:55; compare SRC-0032 ¶45`,caution:`Aspire's reported disposition entered only through Clancy's account; no crisis-evaluator testimony or underlying record was available, and a refusal-of-care characterization is unsupported.`,views:[`course`]},{id:`dec12-dukes`,date:`2022-12-12T16:00:00`,displayDate:`December 12`,title:`Telehealth LMHC follow-up: SI without plan`,short:`Second reported Aspire contact · two PHP pathways`,category:`clinical`,evidence:`Treating testimony`,certainty:`High`,clinician:`Latiesha Dukes, LMHC`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:3,summary:`Clancy reported continued suicidal ideation without plan or attempt and another difficult weekend that included a second Aspire crisis contact.`,details:[`Dukes considered Patrick, Clancy's mother-in-law, prior use of crisis services, and willingness to follow recommendations protective.`,`Clancy said she planned to start a Norwell PHP on December 20; Dukes had not made that referral.`,`With Clancy's consent, Dukes separately initiated a referral to the Women & Infants perinatal program.`,`Dukes did not consider Section 12 or another emergency safety intervention required during this encounter.`],source:`SRC-0098, Trial Day 12, 02:23:15–02:28:20; cross 03:26:18–03:34:16`,caution:`Risk findings are time-bounded. Defense premises that Women & Infants later declined Clancy as ‘overmedicated’ or could not reach Jollotta were not adopted by Dukes and are not established by this testimony.`,views:[`course`]},{id:`dec19-dukes`,date:`2022-12-19T14:00:00`,displayDate:`December 19`,title:`Telehealth LMHC follow-up: mixed improvement`,short:`Low mood persists · no weekend SI · more engaged`,category:`clinical`,evidence:`Treating testimony`,certainty:`High`,clinician:`Latiesha Dukes, LMHC`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:3,summary:`Clancy continued to report low mood and numbness, while reporting no suicidal ideation or crisis need over the preceding weekend and some improvement in sleep, family time, and exercise.`,details:[`Dukes observed greater engagement and an ability to smile and laugh; her note still recorded low mood and numbness for most of the day.`,`Clancy had missed a Women & Infants call while at another medical appointment, returned the contact, and attended the program on December 20.`,`At this visit Dukes did not know that Clancy had gone to the MGH emergency department on December 15, that MGH had made a Women & Infants referral, or that Clancy reportedly chose outpatient Women & Infants care rather than inpatient McLean.`],source:`SRC-0098, Trial Day 12, 02:28:21–02:32:27; redirect/recross 03:47:25–03:56:38`,caution:`Organized or positive behavior coexisted with persistent depressive symptoms. Dukes's information gap supports fragmented communication, not by itself unreasonable care or clinical recovery.`,views:[`course`]},{id:`dec27-dukes`,date:`2022-12-27T12:00:00`,displayDate:`December 27`,title:`LMHC phone contacts: referral and prescription concerns`,short:`Clancy reached · Patrick joined with consent · prescriber redirected`,category:`clinical`,evidence:`Treating testimony`,certainty:`High`,clinician:`Latiesha Dukes, LMHC`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:2,summary:`Dukes called Clancy to report that the referral had been completed and, with Clancy's consent, also spoke with Patrick about his prescription concerns.`,details:[`Medication management was outside Dukes's role, so she redirected Patrick to the prescribing clinician.`,`The chart's multiple entries reflected a list of contacts and tasks, not four unanswered calls to Clancy.`,`Dukes testified that she and Clancy were in communication.`],source:`SRC-0098, Trial Day 12, 02:32:48–02:35:08; cross 03:34:16–03:34:53`,caution:`This establishes care coordination and a reported medication concern, not a new prescription, dose change, medication reconciliation, or ingestion.`,views:[`course`]},{id:`jan7-party`,date:`2023-01-07T15:00:00`,displayDate:`January 7`,title:`Family collateral: Cora's birthday party`,short:`Says she feels ‘like a zombie’ · appears tired but engaged`,category:`collateral`,evidence:`Collateral testimony`,certainty:`Moderate`,side:`top`,tier:3,summary:`Bethany DeCollibus testified that Clancy said things had not improved and she felt ‘like a zombie,’ while appearing tired but remaining engaged with adults and children.`,details:[`DeCollibus acknowledged telling police that Clancy ‘seemed fine.’`,`The self-report and lay observation can coexist; neither is a psychiatric examination.`,`Patrick testified that during January 7–23 morning check-ins Clancy denied suicidal and child-harm thoughts.`],civilClaims:[{claim:`The complaint alleges that at the party Clancy smiled but could not converse or process what others said.`,source:`SRC-0032 ¶69`,context:`DeCollibus's sworn testimony described tiredness and a ‘zombie’ disclosure but also engagement and a prior statement that Clancy ‘seemed fine.’`}],source:`SRC-0084, Trial Day 8, 01:23:25–01:25:06; SRC-0065, 02:26:43–02:27:30; compare SRC-0032 ¶69`,caution:`This is retrospective lay collateral and illustrates apparent functioning, not a formal mental-status examination.`,views:[`course`]},{id:`tufts-dec16`,date:`2022-12-16T11:00:00`,displayDate:`December 16`,title:`Telehealth follow-up: depression despite restored sleep`,short:`Video visit · post-MGH; hopelessness reviewed`,category:`clinical`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`bottom`,tier:2,summary:`At a Tufts video visit after the MGH evaluation, Clancy said sleep finally worked but daytime depression, low motivation, and hopelessness persisted.`,details:[`She described prior suicidal ideation as hopelessness and fear of not improving, without intent or plan.`,`She reported taking quetiapine 200 mg with diazepam and awaiting Women & Infants care.`,`Prescription/fill: lamotrigine 25 mg ×30. Later that day, Jollotta endorsed lamotrigine and recommended quetiapine 300 mg.`],source:`SRC-0087, Trial Day 9, pp. 119–121, 06:31:40–06:38:00; SRC-0091, Trial Day 10, pp. 62–63`,caution:`Prescription, cross-provider endorsement, and a dose target do not establish ingestion.`,views:[`course`]},{id:`tufts-jan9`,date:`2023-01-09T10:00:00`,displayDate:`January 9`,title:`Telehealth follow-up: rebound anxiety`,short:`Video visit · flat mood; no recent SI; no psychosis`,category:`clinical`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`top`,tier:1,summary:`Clancy reported rebound anxiety as nighttime lorazepam wore off, with a flat mood but some ability to laugh and no recent suicidal thoughts.`,details:[`She denied HI, and Tufts observed no psychosis.`,`Amitriptyline and bupropion were discussed, but no antidepressant was selected that day.`,`Medication change: lorazepam was replaced with diazepam; diazepam 5 mg ×14 was filled for a longer-half-life taper strategy.`],source:`SRC-0087, Trial Day 9, pp. 123–124, 06:44:06–06:47:54; SRC-0091, Trial Day 10, pp. 65–66`,caution:`Medication options discussed are not medications prescribed or taken.`,views:[`course`]},{id:`msg-dec8`,date:`2022-12-08T12:00:00`,displayDate:`December 8`,title:`MyChart message: sleep improves; panic follows`,short:`Reports diazepam + quetiapine; doses unspecified`,category:`symptom`,evidence:`Reported to clinician`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`bottom`,tier:2,summary:`Clancy reported taking diazepam and quetiapine, sleeping about 9 p.m. to 5 a.m. with awakenings, then experiencing panic and asking for a slower diazepam taper.`,details:[`The message did not specify the doses used.`],medication:`Diazepam + quetiapine reportedly taken; doses unspecified`,source:`SRC-0096, Day 11 PDF p. 54, 3:17:06–3:18:45`,caution:`The proposed titration schedule does not establish the dose actually taken.`,views:[`course`]},{id:`rx-dec6`,date:`2022-12-06T18:00:00`,displayDate:`December 6`,title:`Prescription/fill: diazepam`,short:`5 mg · quantity unclear in exhibit`,category:`medication`,evidence:`Objective record`,certainty:`Moderate`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:3,summary:`Jollotta initiated the longer-half-life diazepam strategy; the December 6 pharmacy quantity is visually unclear.`,details:[`On redirect Jollotta described one linked tablet on December 6, followed by two on December 7 and eight on December 9.`],medication:`Valium (diazepam) 5 mg filled; quantity unresolved`,source:`SRC-0048; SRC-0096, pp. 48–50 and 105–106`,caution:`The underlying pharmacy exhibit controls; neither the display nor testimony establishes ingestion.`,views:[`course`]},{id:`rx-dec7`,date:`2022-12-07T18:00:00`,displayDate:`December 7`,title:`Prescriptions/fills: quetiapine + diazepam`,short:`100 mg · 5 mg ×2`,category:`medication`,evidence:`Objective record`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`bottom`,tier:3,summary:`The pharmacy display records quetiapine 100 mg and diazepam 5 mg quantity 2 on December 7.`,details:[`The quetiapine display reads quantity 30, while Jollotta testified she believed the quantity was 22.`,`The same-day quetiapine titration was a recommendation, not proof that later 300- or 400-mg targets were used.`],medication:`Seroquel 100 mg; Valium 5 mg ×2`,source:`SRC-0048; SRC-0096, pp. 52–56 and 79–80`,caution:`Quetiapine quantity is disputed; dispensing does not establish adherence.`,views:[`course`]},{id:`call-dec9`,date:`2022-12-09T11:00:00`,displayDate:`December 9`,title:`Phone call: SI without plan or intent`,short:`Better sleep; panic, numbness and intrusive thoughts`,category:`symptom`,evidence:`Contemporaneous record`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:2,summary:`In a call with Lindsay and Patrick, improved sleep was weighed against panic, numbness, intrusive thoughts, and suicidal thoughts without plan or intent.`,details:[`Jollotta again encouraged Women & Infants partial hospitalization.`,`The quetiapine titration continued as a possible mixed/activated-state strategy.`],source:`SRC-0096, pp. 54–56, 3:19:37–3:24:00`,caution:`The state remained a differential, not a confirmed diagnosis.`,views:[`course`]},{id:`rx-dec9`,date:`2022-12-09T16:00:00`,displayDate:`December 9`,title:`Pharmacy fill: diazepam`,short:`5 mg ×8`,category:`medication`,evidence:`Objective record`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`bottom`,tier:3,summary:`The pharmacy exhibit records diazepam 5 mg quantity 8.`,details:[`The fill formed part of the longer-half-life benzodiazepine strategy.`],medication:`Valium (diazepam) 5 mg ×8 filled`,source:`SRC-0048, Dec. 9 row; SRC-0096, pp. 105–106`,caution:`The fill does not establish the dose taken each night.`,views:[`course`]},{id:`rx-dec13`,date:`2022-12-13T17:00:00`,displayDate:`December 13`,title:`Prescription/fill: diazepam`,short:`2 mg ×7 · taper plan`,category:`medication`,evidence:`Objective record`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`bottom`,tier:3,summary:`Diazepam 2 mg quantity 7 was filled as the taper continued.`,details:[`The associated plan was 2 mg nightly; compliance is not independently established.`],medication:`Valium (diazepam) 2 mg ×7 filled`,source:`SRC-0048, Dec. 13 row; SRC-0096, pp. 57–62`,caution:`Planned dose and actual ingestion remain distinct.`,views:[`course`]},{id:`mgh-dec15`,date:`2022-12-15T19:00:00`,displayDate:`December 15`,title:`Hospital encounter: MGH evaluation`,short:`Emergency assessment after higher-care discussion`,category:`hospital`,evidence:`Treating testimony`,certainty:`High`,institution:`Massachusetts General Hospital`,side:`top`,tier:3,summary:`Clancy went to the MGH emergency department after the December 15 higher-level-of-care discussion.`,details:[`She then chose outpatient Women & Infants follow-up.`],source:`SRC-0096, pp. 63–67`,caution:`The complete MGH record is not publicly available; this sequence derives from treating testimony.`,views:[`course`]},{id:`rx-dec16`,date:`2022-12-16T18:00:00`,displayDate:`December 16`,title:`Prescription: lamotrigine`,short:`25 mg ×30 · Jollotta endorsed; ingestion unknown`,category:`medication`,evidence:`Objective record`,certainty:`High`,clinician:`Jennifer Tufts, MD`,institution:`Aster Mental Health`,side:`bottom`,tier:3,summary:`Tufts prescribed and the pharmacy dispensed lamotrigine 25 mg quantity 30.`,details:[`Jollotta later endorsed the plan and counseled about rash and slow titration.`,`She testified that she did not know whether Clancy took it.`],medication:`Lamictal (lamotrigine) 25 mg ×30 prescribed/filled`,source:`SRC-0087, 06:31:40–06:37:05; SRC-0048; SRC-0096, pp. 66–69`,caution:`Prescription, fill, and cross-provider endorsement do not establish ingestion.`,views:[`course`]},{id:`msg-dec19`,date:`2022-12-19T10:00:00`,displayDate:`December 19`,title:`MyChart message: intermittent diazepam use`,short:`Reports 2 mg every other night; asks for refill`,category:`medication`,evidence:`Reported to clinician`,certainty:`High`,clinician:`Rebecca H. Jollotta, CNP`,institution:`South Shore Perinatal Behavioral Health`,side:`top`,tier:3,summary:`Clancy reported using diazepam 2 mg every other night and requested a refill before Women & Infants.`,details:[`Jollotta had recommended daily dosing.`],medication:`Valium (diazepam) 2 mg reportedly every other night`,source:`SRC-0096, pp. 68–69, 3:53:24–3:55:58`,caution:`Patient report does not establish a complete dosing record.`,views:[`course`]},{id:`r
